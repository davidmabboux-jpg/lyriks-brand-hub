<!DOCTYPE html>
<html lang="fr" data-event="vivatech">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyriks · Calendrier éditorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="brand.css">
<style>
  :root{ --bg:#F4F5F8; --panel:#fff; --line:#E6E8EE; --dim:#5B606B; --dim2:#9097A2; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 26px 60px;}

  /* header */
  .head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
  .head .eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--event-ink);margin:0 0 6px;}
  .head h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .head .period{font-family:var(--display);font-size:17px;font-weight:600;color:var(--dim);margin-left:2px;}
  .head .spacer{flex:1;}

  /* controls */
  .ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{font-family:var(--font);font-size:13px;font-weight:700;color:var(--dim);background:none;border:0;padding:9px 16px;cursor:pointer;}
  .seg button.on{background:var(--ink);color:#fff;}
  .nav{display:inline-flex;align-items:center;gap:6px;}
  .nav button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;cursor:pointer;font-weight:700;}
  .nav button:hover{border-color:#FFA101;}
  .today{font-family:var(--font);font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;}
  .today:hover{border-color:#FFA101;}

  /* filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;}
  .cal-toggle{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;user-select:none;transition:border-color .15s,opacity .15s;}
  .cal-toggle .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--c);display:grid;place-items:center;flex:none;}
  .cal-toggle .box::after{content:"✓";color:#fff;font-size:12px;font-weight:900;opacity:0;}
  .cal-toggle.on .box{background:var(--c);}
  .cal-toggle.on .box::after{opacity:1;}
  .cal-toggle.off{opacity:.5;}
  .cal-toggle .lbl{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.15;}
  .cal-toggle .lbl small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--dim2);letter-spacing:.02em;}

  /* calendar shell */
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card);}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
  .weekdays div{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);padding:12px 14px;text-align:left;}

  /* month grid */
  .month{display:grid;grid-template-columns:repeat(7,1fr);}
  .cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 8px 10px;display:flex;flex-direction:column;gap:5px;}
  .cell:nth-child(7n){border-right:0;}
  .cell.out{background:#FAFAFC;}
  .cell .dnum{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--dim);width:24px;height:24px;display:grid;place-items:center;border-radius:7px;}
  .cell.out .dnum{color:#C2C7D0;}
  .cell.today .dnum{background:var(--ink);color:#fff;}
  .chip{display:flex;align-items:center;gap:7px;background:var(--cbg);border-radius:7px;padding:5px 8px;cursor:default;}
  .chip .dot{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none;}
  .chip .t{font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip .tm{font-family:var(--mono);font-size:9.5px;color:var(--dim2);flex:none;}

  /* week view */
  .week{display:grid;grid-template-columns:repeat(7,1fr);}
  .wcol{border-right:1px solid var(--line);min-height:440px;padding:0 0 12px;}
  .wcol:nth-child(7n){border-right:0;}
  .wcol .wh{padding:12px 12px 10px;border-bottom:1px solid var(--line);}
  .wcol .wh .wd{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);}
  .wcol .wh .wn{font-family:var(--display);font-size:22px;font-weight:700;margin-top:2px;}
  .wcol.today .wh .wn{color:#FFA101;}
  .wcol .wbody{display:flex;flex-direction:column;gap:7px;padding:10px;}
  .wevent{border-radius:9px;background:var(--cbg);padding:8px 10px;border:1px solid var(--cbd);}
  .wevent .tm{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c);}
  .wevent .t{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.25;}
  .empty{font-family:var(--mono);font-size:11px;color:var(--dim2);padding:14px;text-align:center;}

  @media(max-width:820px){
    .weekdays div:nth-child(n){font-size:9px;padding:8px 6px;}
    .cell{min-height:84px;padding:6px 5px;}
    .chip .t{font-size:10px;}
    .week{grid-template-columns:1fr;} .wcol{border-right:0;border-bottom:1px solid var(--line);min-height:0;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="eyebrow">Éditorial</div>
        <h1>Calendrier éditorial <span class="period" id="period"></span></h1>
      </div>
      <div class="spacer"></div>
      <div class="ctrls">
        <div class="seg" id="viewSeg">
          <button data-view="month" class="on">Mois</button>
          <button data-view="week">Semaine</button>
        </div>
        <button class="today" id="btnToday">Aujourd'hui</button>
        <div class="nav">
          <button id="prev" title="Précédent">‹</button>
          <button id="next" title="Suivant">›</button>
        </div>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="cal">
      <div class="weekdays" id="weekdays"></div>
      <div id="body"></div>
    </div>
  </div>

<script>
  const CALS = [
    { id:'lyriks', name:'LinkedIn · Lyriks',        sub:'Compte officiel', color:'#8047F4' },
    { id:'david',  name:'LinkedIn · David Mabboux',  sub:'Compte perso',    color:'#FFA101' },
    { id:'adrien', name:'LinkedIn · Adrien Charles', sub:'Compte perso',    color:'#0066FF' },
    { id:'news',   name:'Newsletter',                sub:'Email éditorial', color:'#1FA98A' },
  ];
  const TITLES = {
    lyriks:['Post · Cohérence produit','Post · Cas d\'usage','Annonce · nouvelle feature','Retour d\'expérience client','Post · les 3 piliers'],
    david: ['Post visage · vision','Prise de parole · IA & produit','Réaction · actu du secteur','Behind the scenes','Retour terrain'],
    adrien:['Post produit · démo','Thread technique','Coulisses du build','Astuce · spécification','Focus feature'],
    news:  ['Newsletter mensuelle','Édito · spécial IA','Récap produit du mois'],
  };
  // slots répétés chaque mois (jour, calendrier), heure par canal
  const SLOTS = [
    [3,'lyriks'],[4,'david'],[6,'adrien'],[9,'lyriks'],[10,'news'],[11,'david'],
    [13,'adrien'],[16,'lyriks'],[18,'david'],[20,'adrien'],[23,'lyriks'],[24,'news'],
    [25,'david'],[27,'adrien'],[30,'lyriks']
  ];
  const TIMES = { lyriks:'08:30', david:'12:30', adrien:'17:30', news:'10:00' };

  const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const WD = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  const state = { view:'month', ref:new Date(), active:new Set(CALS.map(c=>c.id)) };
  const cmap = Object.fromEntries(CALS.map(c=>[c.id,c]));
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const daysInMonth = (y,m)=> new Date(y,m+1,0).getDate();
  const isToday = d => { const t=new Date(); return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate(); };

  // événements pour un mois donné (déterministe)
  function eventsForMonth(y,m){
    const dim = daysInMonth(y,m); const ev=[];
    SLOTS.forEach(([day,cal],i)=>{
      if(day>dim) return;
      const arr=TITLES[cal]; const title=arr[Math.floor(i/CALS.length)%arr.length];
      ev.push({ day, cal, title, time:TIMES[cal] });
    });
    return ev;
  }

  function tint(hex,a){ const n=parseInt(hex.slice(1),16); const r=n>>16,g=(n>>8)&255,b=n&255; return `rgba(${r},${g},${b},${a})`; }

  function buildFilters(){
    const f=document.getElementById('filters'); f.innerHTML='';
    CALS.forEach(c=>{
      const on=state.active.has(c.id);
      const el=document.createElement('div');
      el.className='cal-toggle '+(on?'on':'off'); el.style.setProperty('--c',c.color);
      el.innerHTML=`<span class="box"></span><span class="lbl">${c.name}<small>${c.sub}</small></span>`;
      el.onclick=()=>{ if(state.active.has(c.id)) state.active.delete(c.id); else state.active.add(c.id); buildFilters(); render(); };
      f.appendChild(el);
    });
  }

  function render(){
    document.getElementById('weekdays').style.display='grid';
    if(state.view==='month') renderMonth(); else renderWeek();
  }

  function renderMonth(){
    const y=state.ref.getFullYear(), m=state.ref.getMonth();
    document.getElementById('period').textContent = cap(MONTHS[m])+' '+y;
    document.getElementById('weekdays').innerHTML = WD.map(d=>`<div>${d}</div>`).join('');
    const ev=eventsForMonth(y,m).filter(e=>state.active.has(e.cal));
    const byDay={}; ev.forEach(e=>{(byDay[e.day]=byDay[e.day]||[]).push(e);});
    const first=new Date(y,m,1); const lead=(first.getDay()+6)%7; const dim=daysInMonth(y,m);
    const cells=[]; const prevDim=daysInMonth(y,m-1);
    for(let i=0;i<lead;i++) cells.push({out:true,n:prevDim-lead+1+i});
    for(let d=1;d<=dim;d++) cells.push({out:false,n:d,date:new Date(y,m,d),ev:byDay[d]||[]});
    while(cells.length%7!==0) cells.push({out:true,n:cells.length%7});
    let html='<div class="month">';
    cells.forEach(c=>{
      const t = c.date && isToday(c.date);
      html+=`<div class="cell ${c.out?'out':''} ${t?'today':''}"><span class="dnum">${c.n}</span>`;
      (c.ev||[]).forEach(e=>{ const col=cmap[e.cal].color;
        html+=`<div class="chip" style="--c:${col};--cbg:${tint(col,.10)}"><span class="dot"></span><span class="t">${e.title}</span><span class="tm">${e.time}</span></div>`;});
      html+='</div>';
    });
    html+='</div>';
    document.getElementById('body').innerHTML=html;
  }

  function renderWeek(){
    const ref=new Date(state.ref); const off=(ref.getDay()+6)%7;
    const monday=new Date(ref); monday.setDate(ref.getDate()-off);
    const days=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
    const last=days[6];
    const label = monday.getMonth()===last.getMonth()
      ? `${monday.getDate()}–${last.getDate()} ${MONTHS[last.getMonth()]} ${last.getFullYear()}`
      : `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${last.getDate()} ${MONTHS[last.getMonth()]}`;
    document.getElementById('period').textContent = 'Semaine du '+label;
    document.getElementById('weekdays').innerHTML='';
    let html='<div class="week">';
    days.forEach(d=>{
      const ev=eventsForMonth(d.getFullYear(),d.getMonth()).filter(e=>state.active.has(e.cal)&&e.day===d.getDate());
      const t=isToday(d);
      html+=`<div class="wcol ${t?'today':''}"><div class="wh"><div class="wd">${WD[(d.getDay()+6)%7]}</div><div class="wn">${d.getDate()}</div></div><div class="wbody">`;
      if(!ev.length) html+='<div class="empty">—</div>';
      ev.sort((a,b)=>a.time.localeCompare(b.time)).forEach(e=>{ const col=cmap[e.cal].color;
        html+=`<div class="wevent" style="--c:${col};--cbg:${tint(col,.09)};--cbd:${tint(col,.28)}"><div class="tm">${e.time} · ${cmap[e.cal].name.replace('LinkedIn · ','')}</div><div class="t">${e.title}</div></div>`;});
      html+='</div></div>';
    });
    html+='</div>';
    document.getElementById('body').innerHTML=html;
  }

  // controls
  document.getElementById('viewSeg').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    state.view=b.dataset.view;
    [...document.querySelectorAll('#viewSeg button')].forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  document.getElementById('btnToday').onclick=()=>{ state.ref=new Date(); render(); };
  document.getElementById('prev').onclick=()=>{ shift(-1); };
  document.getElementById('next').onclick=()=>{ shift(1); };
  function shift(dir){ const d=state.ref; if(state.view==='month') d.setMonth(d.getMonth()+dir); else d.setDate(d.getDate()+7*dir); state.ref=new Date(d); render(); }

  buildFilters();
  render();
</script>
</body>
</html>
